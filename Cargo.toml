[package]
name = "chorus"
version = "0.1.0"
edition = "2021"
# A text-game engine: single crate, multi-module, lib + 5 [[bin]] targets.

# Dependencies are frozen to exactly these four crates; Cargo.lock is
# committed.
[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"

# The five binary targets:
# - chorus: the main line REPL game over a compiled script
# - reach: card-reachability CLI ("can the player obtain card X?")
# - reach-fuzz: deep randomized fuzz runs of the reach analyzer
# - reach-scale: full-scale reachability census benchmark
# - lint-scripts: lint bundled scripts (load-time warnings)
# All five keep byte-exact stdout text and exit codes.
[[bin]]
name = "chorus"
path = "src/bin/chorus.rs"

[[bin]]
name = "reach"
path = "src/bin/reach.rs"

[[bin]]
name = "reach-fuzz"
path = "src/bin/reach-fuzz.rs"

[[bin]]
name = "reach-scale"
path = "src/bin/reach-scale.rs"

[[bin]]
name = "lint-scripts"
path = "src/bin/lint-scripts.rs"

# Dev builds carry no debug info; test builds keep line tables only so
# failure backtraces stay locatable (memory constraint on a 16 GB box).
[profile.dev]
debug = 0
opt-level = 0

[profile.test]
debug = "line-tables-only"
opt-level = 0

# release is only exercised by the reach-scale benchmark
[profile.release]
opt-level = 2
debug = 0
lto = false
codegen-units = 16
