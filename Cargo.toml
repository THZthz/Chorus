[workspace]
resolver = "2"
members = [
    "crates/story-core",
    "crates/story-content",
    "crates/story-lang",
    "crates/story-engine",
    "crates/story-cli",
    "crates/story-analyze",
    "crates/story-present",
    "crates/cs2sw",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
story-core = { path = "crates/story-core" }
story-content = { path = "crates/story-content" }
story-engine = { path = "crates/story-engine" }
story-lang = { path = "crates/story-lang" }
story-analyze = { path = "crates/story-analyze" }
story-present = { path = "crates/story-present" }
