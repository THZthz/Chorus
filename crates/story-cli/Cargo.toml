[package]
name = "story-cli"
version.workspace = true
edition.workspace = true

[dependencies]
story-core = { workspace = true }
story-content = { workspace = true }
story-engine = { workspace = true }
story-lang = { workspace = true }
story-analyze = { workspace = true, features = ["lang"] }
story-present = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }

[[bin]]
name = "story-cli"
path = "src/main.rs"
